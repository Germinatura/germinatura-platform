name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Start local Supabase
        run: pnpm supabase:start:test
      - name: Export local Supabase configuration
        shell: bash
        run: |
          while IFS='=' read -r name value; do
            value="${value#\"}"
            value="${value%\"}"
            case "$name" in
              API_URL) echo "NEXT_PUBLIC_SUPABASE_URL=$value" >> "$GITHUB_ENV" ;;
              PUBLISHABLE_KEY) echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$value" >> "$GITHUB_ENV" ;;
            esac
          done < <(node tools/run-supabase.mjs status -o env)
          echo "NEXT_PUBLIC_PORTAL_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_PDV_URL=http://127.0.0.1:3001" >> "$GITHUB_ENV"
      - run: pnpm supabase:reset
      - run: pnpm test:db
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=chromium
      - run: pnpm build
      - name: Reject legacy runtime dependencies
        shell: bash
        run: |
          if git grep -n -E 'PrismaClient|@prisma/client|@germinatura/legacy-db|DATABASE_URL|ABACATEPAY' -- apps packages supabase e2e tools package.json pnpm-workspace.yaml turbo.json; then exit 1; fi
      - name: Reject committed secrets and environment files
        run: pnpm security:scan
