name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Start local Supabase
        run: pnpm supabase:start:test
      - name: Export local Supabase configuration
        shell: bash
        run: |
          node tools/run-supabase.mjs status -o env > supabase.env
          source supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_PORTAL_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_PDV_URL=http://127.0.0.1:3001" >> "$GITHUB_ENV"
      - run: pnpm supabase:reset
      - run: pnpm test:db
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=chromium
      - run: pnpm build
      - name: Reject legacy runtime dependencies
        shell: bash
        run: |
          if git grep -n -E 'PrismaClient|@prisma/client|@germinatura/legacy-db|DATABASE_URL|ABACATEPAY' -- apps packages supabase e2e tools package.json pnpm-workspace.yaml turbo.json; then exit 1; fi
      - name: Reject committed secrets and environment files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then exit 1; fi
          if git ls-files | grep -E '(^|/)(dump|backup|users)[^/]*\.(sql|json|zip|tar|gz)$|(^|/)(db-debug|verification_output).*\.txt$|(^|/)out\.json$|\.log$'; then exit 1; fi
          if git grep -n -E '(SUPABASE_SERVICE_ROLE_KEY|CLOUDFLARE_API_TOKEN|MERCADO_PAGO_ACCESS_TOKEN|PICPAY_CLIENT_SECRET)=[A-Za-z0-9._-]{20,}|postgres(ql)?://[^[:space:]]+:[^[:space:]@]+@' -- ':!docs/**' ':!.github/workflows/quality.yml' ':!.env.example' ':!apps/portal/.env.example' ':!apps/pdv/.env.example'; then exit 1; fi
