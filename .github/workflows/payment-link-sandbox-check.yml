name: Payment Link Sandbox Check

# Manual, read-mostly check of the PicPay Payment Link sandbox through the staging jobs worker (ADR 0010).
# The worker refuses to run unless its configuration points to the documented sandbox hosts, writes nothing to the
# database and reports only step outcomes and which settings are present.
on:
  workflow_dispatch:

concurrency:
  group: payment-link-sandbox-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: staging
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      JOBS_URL: https://germinatura-jobs-staging.germinatura.workers.dev
    steps:
      - name: Run sandbox scenarios
        run: |
          test -n "$SUPABASE_SECRET_KEY"
          status=$(curl --silent --show-error --output result.json --write-out '%{http_code}' --max-time 120 \
            -X POST -H "Authorization: Bearer $SUPABASE_SECRET_KEY" "$JOBS_URL/diagnostics/payment-link-sandbox")
          echo "HTTP $status"
          jq . result.json
          test "$status" = "200"
          jq -e '.ok == true' result.json > /dev/null
