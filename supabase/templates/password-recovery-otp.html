<!doctype html>
<html lang="pt-BR">
  <body style="font-family:Arial,sans-serif;color:#172033;background:#f5f7fb;padding:24px">
    <main style="max-width:520px;margin:auto;background:#fff;border-radius:16px;padding:32px">
      <h1 style="font-size:24px;margin-top:0">Código para recuperar sua senha</h1>
      <p>Use o código abaixo para definir uma nova senha. Ele é pessoal, expira em 10 minutos e só pode ser usado uma vez.</p>
      <p style="font-size:32px;font-weight:700;letter-spacing:8px;text-align:center">{{ .Token }}</p>
      <p>Se você não solicitou a recuperação, ignore esta mensagem.</p>
    </main>
  </body>
</html>
